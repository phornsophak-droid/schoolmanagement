<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>សាលាសហគមន៍ច្បារច្រុះ</title>
    <meta name="description" content="ប្រព័ន្ធគ្រប់គ្រងពិន្ទុ និងរបាយការណ៍សាលារៀន" />

    <!-- Add-to-Home-Screen: name, logo & PWA settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- iOS home-screen (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="សាលាសហគមន៍ច្បារច្រុះ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture the install prompt as early as possible (it fires once, often before
      // React mounts) so the in-app "Install" button can use it later.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new Event('pwa-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((error) => {
            console.error('ServiceWorker registration failed: ', error);
          });
        });
      }
    </script>
  </body>
</html>
